<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Detektor Pohybu s Kompenzací Kamery</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }
    h1 { font-size: 1.2rem; margin-bottom: 6px; color: #38bdf8; text-align: center; }
    .status {
      background: #1e293b;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      margin-bottom: 12px;
      border: 1px solid #334155;
      text-align: center;
    }
    .container {
      position: relative;
      width: 100%;
      max-width: 480px;
      aspect-ratio: 4/3;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    video, canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    canvas { z-index: 10; }
    .controls {
      width: 100%;
      max-width: 480px;
      background: #1e293b;
      margin-top: 12px;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #334155;
    }
    .btn {
      width: 100%;
      padding: 12px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .btn:disabled { background: #475569; opacity: 0.6; cursor: not-allowed; }
    .row { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 0.85rem; }
    input[type=range] { width: 50%; }
  </style>
  <!-- Načtení OpenCV.js přes spolehlivou CDN -->
  <script async src="https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.9.0-release.1/opencv.js" onload="onOpenCvReady();" onerror="onOpenCvError();"></script>
</head>
<body>

  <h1>Detekce Samostatného Pohybu</h1>
  <div id="status" class="status">⏳ Načítám algoritmus OpenCV.js...</div>

  <div class="container">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="canvas"></canvas>
  </div>

  <div class="controls">
    <button id="startBtn" class="btn" disabled>Spustit Detekci</button>
    <div class="row">
      <label for="sens">Citlivost detekce:</label>
      <input type="range" id="sens" min="15" max="60" value="30">
    </div>
    <div class="row">
      <label for="debug">Zobrazit body pozadí:</label>
      <input type="checkbox" id="debug" checked>
    </div>
  </div>

  <script>
    let cvReady = false;
    const statusEl = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const sensInput = document.getElementById('sens');
    const debugCheck = document.getElementById('debug');

    let isRunning = false;
    let stream = null;

    let prevGray = null;
    let prevPoints = null;
    const procW = 320;
    const procH = 240;

    function onOpenCvReady() {
      cvReady = true;
      statusEl.innerText = "✅ Algoritmus připraven. Stiskněte Spustit.";
      statusEl.style.color = "#4ade80";
      startBtn.disabled = false;
    }

    function onOpenCvError() {
      statusEl.innerText = "❌ Nepodařilo se načíst OpenCV.js. Zkontrolujte připojení.";
      statusEl.style.color = "#f87171";
    }

    startBtn.addEventListener('click', async () => {
      if (!isRunning) {
        await startCamera();
      } else {
        stopCamera();
      }
    });

    async function startCamera() {
      try {
        statusEl.innerText = "🎥 Otevírám kameru...";
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        });
        video.srcObject = stream;
        await video.play();

        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;

        isRunning = true;
        startBtn.innerText = "Zastavit Detekci";
        startBtn.style.background = "#dc2626";
        statusEl.innerText = "🟢 Detekce aktivní (Kompenzuji pohyb kamery)";

        requestAnimationFrame(processLoop);
      } catch (err) {
        statusEl.innerText = "❌ Chyba kamery: " + err.message;
        statusEl.style.color = "#f87171";
      }
    }

    function stopCamera() {
      isRunning = false;
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
      }
      if (prevGray) { prevGray.delete(); prevGray = null; }
      if (prevPoints) { prevPoints.delete(); prevPoints = null; }
      startBtn.innerText = "Spustit Detekci";
      startBtn.style.background = "#0284c7";
      statusEl.innerText = "⏹️ Zastaveno";
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function processLoop() {
      if (!isRunning) return;

      // Zmenšení snímku pro rychlé zpracování na mobilu
      const procCanvas = document.createElement('canvas');
      procCanvas.width = procW;
      procCanvas.height = procH;
      const procCtx = procCanvas.getContext('2d');
      procCtx.drawImage(video, 0, 0, procW, procH);

      let src = cv.imread(procCanvas);
      let currGray = new cv.Mat();
      cv.cvtColor(src, currGray, cv.COLOR_RGBA2GRAY);

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (!prevGray) {
        // První snímek - nalezení bodů pozadí
        prevGray = currGray.clone();
        prevPoints = new cv.Mat();
        cv.goodFeaturesToTrack(prevGray, prevPoints, 80, 0.01, 10);
        src.delete(); currGray.delete();
        requestAnimationFrame(processLoop);
        return;
      }

      // Sledování bodů pozadí (Optical Flow)
      let currPoints = new cv.Mat();
      let statusMat = new cv.Mat();
      let errMat = new cv.Mat();
      let winSize = new cv.Size(15, 15);
      let criteria = new cv.TermCriteria(cv.TermCriteria_COUNT + cv.TermCriteria_EPS, 10, 0.03);

      if (prevPoints.rows > 10) {
        cv.calcOpticalFlowPyrLK(prevGray, currGray, prevPoints, currPoints, statusMat, errMat, winSize, 2, criteria);

        let p1 = [], p2 = [];
        for (let i = 0; i < statusMat.rows; i++) {
          if (statusMat.data[i] === 1) {
            p1.push(prevPoints.data32F[i * 2], prevPoints.data32F[i * 2 + 1]);
            p2.push(currPoints.data32F[i * 2], currPoints.data32F[i * 2 + 1]);
          }
        }

        if (p1.length >= 12) {
          let matP1 = cv.matFromArray(p1.length / 2, 1, cv.CV_32FC2, p1);
          let matP2 = cv.matFromArray(p2.length / 2, 1, cv.CV_32FC2, p2);

          // Výpočet transformace pohybu telefonu
          let H = cv.findHomography(matP1, matP2, cv.RANSAC, 3.0);

          if (!H.empty()) {
            // Geometrické zarovnání minulého snímku na nové pozadí
            let warpedPrev = new cv.Mat();
            cv.warpPerspective(prevGray, warpedPrev, H, new cv.Size(procW, procH));

            // Odečtení zarovnaných snímků
            let diff = new cv.Mat();
            cv.absdiff(currGray, warpedPrev, diff);

            let threshVal = parseInt(sensInput.value);
            let thresh = new cv.Mat();
            cv.threshold(diff, thresh, threshVal, 255, cv.THRESH_BINARY);

            let M = cv.Mat.ones(5, 5, cv.CV_8U);
            let dilated = new cv.Mat();
            cv.dilate(thresh, dilated, M);

            // Vyhledání samostatně se pohybujících objektů
            let contours = new cv.MatVector();
            let hierarchy = new cv.Mat();
            cv.findContours(dilated, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

            const scaleX = canvas.width / procW;
            const scaleY = canvas.height / procH;

            for (let i = 0; i < contours.size(); ++i) {
              let contour = contours.get(i);
              if (cv.contourArea(contour) > 120) { // Ignorovat drobný šum
                let rect = cv.boundingRect(contour);
                ctx.strokeStyle = "#00ff66";
                ctx.lineWidth = 3;
                ctx.strokeRect(rect.x * scaleX, rect.y * scaleY, rect.width * scaleX, rect.height * scaleY);

                ctx.fillStyle = "#00ff66";
                ctx.font = "bold 14px sans-serif";
                ctx.fillText("Objekt v pohybu", rect.x * scaleX, Math.max(15, rect.y * scaleY - 6));
              }
            }

            warpedPrev.delete(); diff.delete(); thresh.delete(); M.delete(); dilated.delete(); contours.delete(); hierarchy.delete(); H.delete();
          }
          matP1.delete(); matP2.delete();
        }

        // Vykreslení modrých bodů pozadí (Debug režim)
        if (debugCheck.checked) {
          const scaleX = canvas.width / procW;
          const scaleY = canvas.height / procH;
          ctx.fillStyle = "#38bdf8";
          for (let i = 0; i < currPoints.rows; i++) {
            if (statusMat.data[i] === 1) {
              ctx.beginPath();
              ctx.arc(currPoints.data32F[i * 2] * scaleX, currPoints.data32F[i * 2 + 1] * scaleY, 3, 0, 2 * Math.PI);
              ctx.fill();
            }
          }
        }
      }

      // Příprava na další snímek
      prevGray.delete();
      prevGray = currGray.clone();

      if (prevPoints.rows < 25) {
        prevPoints.delete();
        prevPoints = new cv.Mat();
        cv.goodFeaturesToTrack(prevGray, prevPoints, 80, 0.01, 10);
      } else {
        prevPoints.delete();
        prevPoints = currPoints.clone();
      }

      src.delete(); currGray.delete(); currPoints.delete(); statusMat.delete(); errMat.delete();

      requestAnimationFrame(processLoop);
    }
  </script>
</body>
</html>
