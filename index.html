<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Vektorová Detekce Samostatného Pohybu</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }
    h1 { font-size: 1.2rem; margin-bottom: 6px; color: #38bdf8; text-align: center; }
    .status {
      background: #1e293b;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.85rem;
      margin-bottom: 12px;
      border: 1px solid #334155;
      text-align: center;
      width: 100%;
      max-width: 480px;
    }
    .container {
      position: relative;
      width: 100%;
      max-width: 480px;
      aspect-ratio: 4/3;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    video, canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    canvas { z-index: 10; }
    .controls {
      width: 100%;
      max-width: 480px;
      background: #1e293b;
      margin-top: 12px;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #334155;
    }
    .btn {
      width: 100%;
      padding: 12px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .btn:disabled { background: #475569; opacity: 0.6; cursor: not-allowed; }
    .row { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 0.85rem; }
    input[type=range] { width: 50%; }
  </style>
</head>
<body>

  <h1>Detekce Samostatného Pohybu (Vektory)</h1>
  <div id="status" class="status">⏳ Načítám OpenCV z docs.opencv.org...</div>

  <div class="container">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="canvas"></canvas>
  </div>

  <div class="controls">
    <button id="startBtn" class="btn" disabled>Spustit Detekci</button>
    <div class="row">
      <label for="sens">Prahová odchylka pohybu:</label>
      <input type="range" id="sens" min="5" max="25" value="10">
    </div>
    <div class="row">
      <label for="debug">Zobrazit vektory bodů:</label>
      <input type="checkbox" id="debug" checked>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const sensInput = document.getElementById('sens');
    const debugCheck = document.getElementById('debug');

    let isRunning = false;
    let stream = null;
    let prevGray = null;
    const procW = 320;
    const procH = 240;

    window.Module = {
      onRuntimeInitialized: function() {
        statusEl.innerText = "✅ Vektorový engine OpenCV připraven!";
        statusEl.style.color = "#4ade80";
        startBtn.disabled = false;
      }
    };

    const script = document.createElement('script');
    script.src = "https://docs.opencv.org/4.x/opencv.js";
    script.async = true;
    script.onerror = () => {
      statusEl.innerText = "❌ Chyba stahování OpenCV.";
      statusEl.style.color = "#f87171";
    };
    document.body.appendChild(script);

    startBtn.addEventListener('click', async () => {
      if (!isRunning) await startCamera();
      else stopCamera();
    });

    async function startCamera() {
      try {
        statusEl.innerText = "🎥 Spouštím kameru...";
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        });
        video.srcObject = stream;
        await video.play();

        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;

        isRunning = true;
        startBtn.innerText = "Zastavit Detekci";
        startBtn.style.background = "#dc2626";
        statusEl.innerText = "🟢 Detekce aktivní (Analýza reziduálních vektorů)";

        requestAnimationFrame(processLoop);
      } catch (err) {
        statusEl.innerText = "❌ Chyba kamery: " + err.message;
        statusEl.style.color = "#f87171";
      }
    }

    function stopCamera() {
      isRunning = false;
      if (stream) stream.getTracks().forEach(t => t.stop());
      if (prevGray) { prevGray.delete(); prevGray = null; }
      startBtn.innerText = "Spustit Detekci";
      startBtn.style.background = "#0284c7";
      statusEl.innerText = "⚡ Připraveno";
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    // Pomocná funkce pro shlukování odchýlených bodů do objektů (DBSCAN-like clustering)
    function clusterPoints(points, maxDist) {
      let clusters = [];
      let visited = new Array(points.length).fill(false);

      for (let i = 0; i < points.length; i++) {
        if (visited[i]) continue;
        let cluster = [points[i]];
        visited[i] = true;

        for (let j = 0; j < cluster.length; j++) {
          let pA = cluster[j];
          for (let k = 0; k < points.length; k++) {
            if (!visited[k]) {
              let pB = points[k];
              let dist = Math.hypot(pA.x - pB.x, pA.y - pB.y);
              if (dist < maxDist) {
                visited[k] = true;
                cluster.push(pB);
              }
            }
          }
        }
        clusters.push(cluster);
      }
      return clusters;
    }

    function processLoop() {
      if (!isRunning) return;

      const procCanvas = document.createElement('canvas');
      procCanvas.width = procW;
      procCanvas.height = procH;
      const procCtx = procCanvas.getContext('2d');
      procCtx.drawImage(video, 0, 0, procW, procH);

      let src = cv.imread(procCanvas);
      let currGray = new cv.Mat();
      cv.cvtColor(src, currGray, cv.COLOR_RGBA2GRAY);

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (prevGray) {
        // 1. Najdeme hustou síť bodů po celé ploše
        let refPoints = new cv.Mat();
        cv.goodFeaturesToTrack(prevGray, refPoints, 140, 0.01, 8);

        if (refPoints.rows >= 10) {
          let currPoints = new cv.Mat(), statusMat = new cv.Mat(), errMat = new cv.Mat();
          let winSize = new cv.Size(15, 15);
          let criteria = new cv.TermCriteria(cv.TermCriteria_COUNT + cv.TermCriteria_EPS, 10, 0.03);

          // 2. Sledování posunu bodů optickým tokem
          cv.calcOpticalFlowPyrLK(prevGray, currGray, refPoints, currPoints, statusMat, errMat, winSize, 2, criteria);

          let p1 = [], p2 = [];
          for (let i = 0; i < statusMat.rows; i++) {
            if (statusMat.data[i] === 1) {
              p1.push(refPoints.data32F[i * 2], refPoints.data32F[i * 2 + 1]);
              p2.push(currPoints.data32F[i * 2], currPoints.data32F[i * 2 + 1]);
            }
          }

          if (p1.length >= 10) {
            let matP1 = cv.matFromArray(p1.length / 2, 1, cv.CV_32FC2, p1);
            let matP2 = cv.matFromArray(p2.length / 2, 1, cv.CV_32FC2, p2);

            // 3. Výpočet globálního pohybu pozadí / kamery
            let H = cv.findHomography(matP1, matP2, cv.RANSAC, 3.0);

            if (!H.empty()) {
              let h = H.data64F;
              let movingPoints = [];
              const threshold = parseFloat(sensInput.value); // Prahová odchylka v pixelech

              const scaleX = canvas.width / procW;
              const scaleY = canvas.height / procH;

              // 4. Porovnání očekávané pozice podle kamery vs skutečné pozice bodu
              for (let i = 0; i < p1.length; i += 2) {
                let x1 = p1[i], y1 = p1[i+1];
                let x2 = p2[i], y2 = p2[i+1];

                let denom = h[6] * x1 + h[7] * y1 + h[8];
                if (Math.abs(denom) < 0.0001) continue;

                // Matematická predikce, kam měl bod dopadnout, pokud je součástí statického pozadí
                let predX = (h[0] * x1 + h[1] * y1 + h[2]) / denom;
                let predY = (h[3] * x1 + h[4] * y1 + h[5]) / denom;

                // Reziduální odchylka (vektorový rozdíl)
                let dist = Math.hypot(x2 - predX, y2 - predY);

                if (dist > threshold) {
                  // Tento bod se pohybuje samovolně mimo pohyb kamery!
                  movingPoints.push({ x: x2, y: y2 });

                  if (debugCheck.checked) {
                    ctx.fillStyle = "#ff0055"; // Červený bod = samostatný pohyb
                    ctx.beginPath();
                    ctx.arc(x2 * scaleX, y2 * scaleY, 4, 0, 2 * Math.PI);
                    ctx.fill();
                  }
                } else if (debugCheck.checked) {
                  ctx.fillStyle = "#38bdf8"; // Modrý bod = statické pozadí
                  ctx.beginPath();
                  ctx.arc(x2 * scaleX, y2 * scaleY, 2, 0, 2 * Math.PI);
                  ctx.fill();
                }
              }

              // 5. Shlukování odchýlených bodů do souvislých obdélníků
              let clusters = clusterPoints(movingPoints, 45); // Max vzdálenost bodů v objektu

              for (let c of clusters) {
                if (c.length >= 3) { // Alespoň 3 odchýlené body tvoří platný objekt
                  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                  for (let p of c) {
                    if (p.x < minX) minX = p.x;
                    if (p.x > maxX) maxX = p.x;
                    if (p.y < minY) minY = p.y;
                    if (p.y > maxY) maxY = p.y;
                  }

                  let rectX = (minX - 8) * scaleX;
                  let rectY = (minY - 8) * scaleY;
                  let rectW = (maxX - minX + 16) * scaleX;
                  let rectH = (maxY - minY + 16) * scaleY;

                  ctx.strokeStyle = "#00ff66";
                  ctx.lineWidth = 3;
                  ctx.strokeRect(rectX, rectY, rectW, rectH);

                  ctx.fillStyle = "#00ff66";
                  ctx.font = "bold 14px sans-serif";
                  ctx.fillText("Samostatný pohyb", rectX, Math.max(16, rectY - 6));
                }
              }

              H.delete();
            }
            matP1.delete(); matP2.delete();
          }
          currPoints.delete(); statusMat.delete(); errMat.delete();
        }
        refPoints.delete();
        prevGray.delete();
      }

      prevGray = currGray; // Uložení aktuálního snímku jako referenčního pro příští cyklus
      src.delete();
      requestAnimationFrame(processLoop);
    }
  </script>
</body>
</html>
