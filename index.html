<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Pokročilá Detekce Pohybu (Filtrovaná)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }
    h1 { font-size: 1.2rem; margin-bottom: 6px; color: #38bdf8; text-align: center; }
    .status {
      background: #1e293b;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.85rem;
      margin-bottom: 12px;
      border: 1px solid #334155;
      text-align: center;
      width: 100%;
      max-width: 480px;
    }
    .container {
      position: relative;
      width: 100%;
      max-width: 480px;
      aspect-ratio: 4/3;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    video, canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    canvas { z-index: 10; }
    .controls {
      width: 100%;
      max-width: 480px;
      background: #1e293b;
      margin-top: 12px;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #334155;
    }
    .btn {
      width: 100%;
      padding: 12px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .btn:disabled { background: #475569; opacity: 0.6; cursor: not-allowed; }
    .row { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 0.85rem; }
    input[type=range] { width: 50%; }
  </style>
</head>
<body>

  <h1>Detekce Samostatného Pohybu</h1>
  <div id="status" class="status">⏳ Načítám OpenCV z docs.opencv.org...</div>

  <div class="container">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="canvas"></canvas>
  </div>

  <div class="controls">
    <button id="startBtn" class="btn" disabled>Spustit Detekci</button>
    <div class="row">
      <label for="sens">Citlivost detekce:</label>
      <input type="range" id="sens" min="15" max="50" value="25">
    </div>
    <div class="row">
      <label for="debug">Zobrazit body pozadí:</label>
      <input type="checkbox" id="debug" checked>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const sensInput = document.getElementById('sens');
    const debugCheck = document.getElementById('debug');

    let isRunning = false;
    let stream = null;
    const frameHistory = []; 
    const procW = 320;
    const procH = 240;

    // Inicializace OpenCV
    window.Module = {
      onRuntimeInitialized: function() {
        statusEl.innerText = "✅ OpenCV v pořádku načteno!";
        statusEl.style.color = "#4ade80";
        startBtn.disabled = false;
      }
    };

    const script = document.createElement('script');
    script.src = "https://docs.opencv.org/4.x/opencv.js";
    script.async = true;
    script.onerror = () => {
      statusEl.innerText = "❌ Chyba stahování OpenCV skriptu.";
      statusEl.style.color = "#f87171";
    };
    document.body.appendChild(script);

    startBtn.addEventListener('click', async () => {
      if (!isRunning) {
        await startCamera();
      } else {
        stopCamera();
      }
    });

    async function startCamera() {
      try {
        statusEl.innerText = "🎥 Startuji kameru...";
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        });
        video.srcObject = stream;
        await video.play();

        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;

        isRunning = true;
        startBtn.innerText = "Zastavit Detekci";
        startBtn.style.background = "#dc2626";
        statusEl.innerText = "🟢 Detekce aktivní (s potlačením šumu hran)";

        requestAnimationFrame(processLoop);
      } catch (err) {
        statusEl.innerText = "❌ Chyba kamery: " + err.message;
        statusEl.style.color = "#f87171";
      }
    }

    function stopCamera() {
      isRunning = false;
      if (stream) stream.getTracks().forEach(t => t.stop());
      while(frameHistory.length > 0) {
        let f = frameHistory.pop();
        f.delete();
      }
      startBtn.innerText = "Spustit Detekci";
      startBtn.style.background = "#0284c7";
      statusEl.innerText = "⚡ Připraveno";
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function processLoop() {
      if (!isRunning) return;

      // 1. Získání snímku z videa
      const procCanvas = document.createElement('canvas');
      procCanvas.width = procW;
      procCanvas.height = procH;
      const procCtx = procCanvas.getContext('2d');
      procCtx.drawImage(video, 0, 0, procW, procH);

      let src = cv.imread(procCanvas);
      let currGray = new cv.Mat();
      cv.cvtColor(src, currGray, cv.COLOR_RGBA2GRAY);

      // 2. NOVINKA: Gaussovské rozostření pro eliminaci falešných hran nábytku
      let currBlur = new cv.Mat();
      cv.GaussianBlur(currGray, currBlur, new cv.Size(5, 5), 0, 0);

      // Ukládáme rozostřené snímky do pufru
      frameHistory.push(currBlur);
      currGray.delete(); // Smazat ostrý snímek

      if (frameHistory.length > 4) {
        let oldMat = frameHistory.shift();
        oldMat.delete();
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (frameHistory.length >= 3) {
        let refBlur = frameHistory[0];

        // Hledání bodů pozadí na rozostřeném snímku
        let refPoints = new cv.Mat();
        cv.goodFeaturesToTrack(refBlur, refPoints, 90, 0.01, 10);

        if (refPoints.rows >= 8) {
          let currPoints = new cv.Mat(), statusMat = new cv.Mat(), errMat = new cv.Mat();
          let winSize = new cv.Size(15, 15);
          let criteria = new cv.TermCriteria(cv.TermCriteria_COUNT + cv.TermCriteria_EPS, 10, 0.03);

          let latestBlur = frameHistory[frameHistory.length - 1];
          cv.calcOpticalFlowPyrLK(refBlur, latestBlur, refPoints, currPoints, statusMat, errMat, winSize, 2, criteria);

          let p1 = [], p2 = [];
          for (let i = 0; i < statusMat.rows; i++) {
            if (statusMat.data[i] === 1) {
              p1.push(refPoints.data32F[i * 2], refPoints.data32F[i * 2 + 1]);
              p2.push(currPoints.data32F[i * 2], currPoints.data32F[i * 2 + 1]);
            }
          }

          if (p1.length >= 8) {
            let matP1 = cv.matFromArray(p1.length / 2, 1, cv.CV_32FC2, p1);
            let matP2 = cv.matFromArray(p2.length / 2, 1, cv.CV_32FC2, p2);

            // Výpočet kompenzace pohybu kamery s přísnějším filtrem RANSAC (2.0)
            let H = cv.findHomography(matP1, matP2, cv.RANSAC, 2.0);

            if (!H.empty()) {
              let warpedRef = new cv.Mat();
              cv.warpPerspective(refBlur, warpedRef, H, new cv.Size(procW, procH));

              // Rozdíl vyhlazených snímků
              let diff = new cv.Mat();
              cv.absdiff(latestBlur, warpedRef, diff);

              let threshVal = parseInt(sensInput.value);
              let thresh = new cv.Mat();
              cv.threshold(diff, thresh, threshVal, 255, cv.THRESH_BINARY);

              // 3. NOVINKA: Erodování (vymazání tenkých fiktivních čar z hran nábytku)
              let M_erode = cv.Mat.ones(3, 3, cv.CV_8U);
              let eroded = new cv.Mat();
              cv.erode(thresh, eroded, M_erode);

              // 4. NOVINKA: Dilatace (spojení reálného objektu do souvislého tvaru)
              let M_dilate = cv.Mat.ones(7, 7, cv.CV_8U);
              let dilated = new cv.Mat();
              cv.dilate(eroded, dilated, M_dilate);

              let contours = new cv.MatVector();
              let hierarchy = new cv.Mat();
              cv.findContours(dilated, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

              const scaleX = canvas.width / procW;
              const scaleY = canvas.height / procH;

              for (let i = 0; i < contours.size(); ++i) {
                let contour = contours.get(i);
                let area = cv.contourArea(contour);

                // 5. NOVINKA: Minimální plocha zvýšena z 40 na 250 px pro odfiltrování zbytků šumu
                if (area > 250) {
                  let rect = cv.boundingRect(contour);
                  let aspect = rect.width / rect.height;

                  // Ignorujeme nereálné extrémě tenké nudle
                  if (aspect > 0.1 && aspect < 10.0) {
                    ctx.strokeStyle = "#00ff66";
                    ctx.lineWidth = 3;
                    ctx.strokeRect(rect.x * scaleX, rect.y * scaleY, rect.width * scaleX, rect.height * scaleY);

                    ctx.fillStyle = "#00ff66";
                    ctx.font = "bold 14px sans-serif";
                    ctx.fillText("Pohyb objektu", rect.x * scaleX, Math.max(16, rect.y * scaleY - 6));
                  }
                }
              }

              if (debugCheck.checked) {
                ctx.fillStyle = "#38bdf8";
                for (let i = 0; i < p2.length; i += 2) {
                  ctx.beginPath();
                  ctx.arc(p2[i] * scaleX, p2[i + 1] * scaleY, 3, 0, 2 * Math.PI);
                  ctx.fill();
                }
              }

              warpedRef.delete(); diff.delete(); thresh.delete(); 
              M_erode.delete(); eroded.delete(); M_dilate.delete(); dilated.delete(); 
              contours.delete(); hierarchy.delete(); H.delete();
            }
            matP1.delete(); matP2.delete();
          }
          currPoints.delete(); statusMat.delete(); errMat.delete();
        }
        refPoints.delete();
      }

      src.delete();
      requestAnimationFrame(processLoop);
    }
  </script>
</body>
</html>
